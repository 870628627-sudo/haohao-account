name: Deploy to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aliyun
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy haohao-account
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: /www/haohao-account
          APP_NAME: haohao-account
          BRANCH: main
          REPO_URL: https://github.com/870628627-sudo/haohao-account.git
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          envs: APP_DIR,APP_NAME,BRANCH,REPO_URL,DEPLOY_SHA
          script: |
            set -e
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git pull --ff-only origin "$BRANCH"
            fi
            bash "$APP_DIR/scripts/deploy_aliyun.sh"
