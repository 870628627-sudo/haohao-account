<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#fffaf4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="豪豪记账" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/bear-ledger.jpg" />
    <link rel="stylesheet" href="/styles.css?v=20260511-cute-tabs-profile" />
  </head>
  <body>
    <main id="app"></main>
    <script src="/app.js?v=20260511-cute-tabs-profile" defer></script>
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return
          refreshing = true
          window.location.reload()
        })
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
